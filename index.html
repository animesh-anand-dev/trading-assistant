<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Trading Decision Assistant</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;600;700;800&display=swap">
<style>
:root {
  --bg: #eef2f8; --surface: #fff; --surface-2: #f2f5fa; --line: #dbe3ee;
  --text: #0f1b2d; --muted: #5b6b82; --accent: #0b6bcb; --accent-2: #5b5bd6; --accent-ink: #fff;
  --buy: #0f8a4f; --buy-bg: #e3f6ec; --wait: #a86a00; --wait-bg: #fff2d6;
  --no: #c23b3b; --no-bg: #fde8e8; --focus: rgba(11,107,203,.28); --glow: rgba(11,107,203,.14);
  --shadow: 0 1px 2px rgba(15,27,45,.06), 0 14px 34px rgba(15,27,45,.09);
  box-sizing: border-box; padding-top: env(safe-area-inset-top, 0px); padding-bottom: env(safe-area-inset-bottom, 0px); color-scheme: light;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #0a111f; --surface: #121c2f; --surface-2: #19263c; --line: #25344d;
    --text: #e8eefb; --muted: #94a3bd; --accent: #4aa3ff; --accent-2: #8b8bff; --accent-ink: #06182e;
    --buy: #4ade80; --buy-bg: #10281d; --wait: #fbbf24; --wait-bg: #2b2310;
    --no: #f87171; --no-bg: #2d1717; --focus: rgba(74,163,255,.35); --glow: rgba(74,163,255,.16);
    --shadow: 0 1px 2px rgba(0,0,0,.4), 0 16px 40px rgba(0,0,0,.35); color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #0a111f; --surface: #121c2f; --surface-2: #19263c; --line: #25344d;
  --text: #e8eefb; --muted: #94a3bd; --accent: #4aa3ff; --accent-2: #8b8bff; --accent-ink: #06182e;
  --buy: #4ade80; --buy-bg: #10281d; --wait: #fbbf24; --wait-bg: #2b2310;
  --no: #f87171; --no-bg: #2d1717; --focus: rgba(74,163,255,.35); --glow: rgba(74,163,255,.16);
  --shadow: 0 1px 2px rgba(0,0,0,.4), 0 16px 40px rgba(0,0,0,.35); color-scheme: dark;
}
html { scroll-padding-top: env(safe-area-inset-top, 0px); height: 100%; }
* { box-sizing: border-box; }
body {
  margin: 0; height: 100%; overflow: hidden; color: var(--text);
  background: radial-gradient(900px 340px at 50% -80px, var(--glow), transparent 70%), var(--bg);
  font-family: "Manrope", system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; font-size: 14px; line-height: 1.4; -webkit-font-smoothing: antialiased;
}
.ic { width: 16px; height: 16px; flex: none; fill: none; stroke: currentColor; stroke-width: 2; stroke-linecap: round; stroke-linejoin: round; }
.app { height: 100%; max-width: 560px; margin: 0 auto; padding: 12px 14px; display: flex; flex-direction: column; gap: clamp(8px, 1.5vh, 14px); }
header { display: flex; align-items: center; gap: 11px; }
.logo { width: 38px; height: 38px; border-radius: 12px; display: grid; place-items: center; color: #fff; background: linear-gradient(135deg, var(--accent), var(--accent-2)); box-shadow: 0 6px 16px var(--glow); flex: none; }
.logo .ic { width: 21px; height: 21px; stroke-width: 2.2; }
header div.t { flex: 1; min-width: 0; }
header h1 { font-size: 18px; line-height: 1.2; margin: 0; font-weight: 800; letter-spacing: -.02em; }
header p { margin: 0; color: var(--muted); font-size: 12.5px; }
.ghost { display: flex; align-items: center; gap: 6px; border: 1px solid var(--line); background: var(--surface); color: var(--muted); border-radius: 10px; padding: 7px 11px; font: inherit; font-size: 13px; font-weight: 600; cursor: pointer; }
.ghost:hover { color: var(--text); }
.panel { flex: 1; min-height: 0; display: flex; flex-direction: column; justify-content: space-between; gap: 8px; background: var(--surface); border: 1px solid var(--line); border-radius: 20px; padding: 12px; box-shadow: var(--shadow); }
.sec { display: flex; align-items: center; gap: 6px; font-size: 11.5px; font-weight: 700; letter-spacing: .05em; text-transform: uppercase; color: var(--muted); margin: 0 0 5px 2px; }
.sec .ic { width: 14px; height: 14px; color: var(--accent); }
.row2 { display: grid; gap: 8px; }
.seg { display: grid; gap: 3px; padding: 3px; background: var(--surface-2); border: 1px solid var(--line); border-radius: 13px; }
.seg.c3 { grid-template-columns: repeat(3, 1fr); } .seg.c2 { grid-template-columns: repeat(2, 1fr); }
.seg button { border: 0; background: transparent; color: var(--muted); font: inherit; font-size: 13.5px; font-weight: 700; padding: 8px 4px; border-radius: 10px; cursor: pointer; min-height: 38px; display: flex; align-items: center; justify-content: center; gap: 6px; transition: background .15s, color .15s, box-shadow .15s; }
.seg button[aria-pressed="true"] { background: var(--surface); color: var(--text); box-shadow: 0 1px 4px rgba(15,27,45,.22); }
.seg button[aria-pressed="true"] .ic { color: var(--tone); }
.t-buy { --tone: var(--buy); } .t-no { --tone: var(--no); } .t-wait { --tone: var(--wait); }
.grid3 { display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; }
.field { display: flex; flex-direction: column; gap: 4px; min-width: 0; }
.field label { display: flex; align-items: center; gap: 5px; font-size: 12px; font-weight: 600; color: var(--muted); white-space: nowrap; overflow: hidden; }
.field label .ic { width: 13px; height: 13px; color: var(--accent); }
.field.off { opacity: .45; }
input[type=number] { width: 100%; height: 42px; padding: 0 10px; border-radius: 12px; border: 1px solid var(--line); background: var(--surface-2); color: var(--text); font: inherit; font-size: 16px; font-weight: 600; font-variant-numeric: tabular-nums; outline: none; transition: border-color .15s, box-shadow .15s; }
input[type=number]::placeholder { color: var(--muted); opacity: .5; font-weight: 500; }
input[type=number]:focus { border-color: var(--accent); box-shadow: 0 0 0 3px var(--focus); background: var(--surface); }
input[type=number]:disabled { cursor: not-allowed; }
input.invalid { border-color: var(--no); box-shadow: 0 0 0 3px var(--no-bg); }
button:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
.error { display: none; align-items: center; gap: 8px; margin: 0; padding: 8px 12px; border-radius: 10px; background: var(--no-bg); color: var(--no); font-size: 13px; font-weight: 600; }
.error.show { display: flex; }
.primary { width: 100%; height: 50px; flex: none; border: 0; border-radius: 14px; color: var(--accent-ink); background: linear-gradient(135deg, var(--accent), var(--accent-2)); display: flex; align-items: center; justify-content: center; gap: 8px; font: inherit; font-size: 16px; font-weight: 800; cursor: pointer; box-shadow: 0 8px 20px var(--glow); transition: transform .1s, filter .15s; }
.primary .ic { width: 18px; height: 18px; stroke-width: 2.4; }
.primary:hover { filter: brightness(1.07); } .primary:active { transform: scale(.985); }
.scrim { position: fixed; inset: 0; background: rgba(5,10,20,.5); display: none; z-index: 5; }
.scrim.show { display: block; }
.sheet { position: fixed; left: 0; right: 0; bottom: 0; z-index: 6; margin: 0 auto; max-width: 560px; padding: 20px 18px calc(18px + env(safe-area-inset-bottom, 0px)); border-radius: 24px 24px 0 0; border: 1px solid var(--line); border-bottom: 0; background: var(--surface); box-shadow: 0 -12px 40px rgba(0,0,0,.25); transform: translateY(105%); transition: transform .25s ease-out; visibility: hidden; }
.sheet.show { transform: none; visibility: visible; }
.sheet.buy { background: var(--buy-bg); border-color: var(--buy); --c: var(--buy); }
.sheet.wait { background: var(--wait-bg); border-color: var(--wait); --c: var(--wait); }
.sheet.no { background: var(--no-bg); border-color: var(--no); --c: var(--no); }
.head { display: flex; align-items: center; gap: 12px; margin-bottom: 8px; }
.big { width: 52px; height: 52px; border-radius: 16px; display: grid; place-items: center; background: var(--c); color: var(--surface); flex: none; }
.big .ic { width: 28px; height: 28px; stroke-width: 2.4; }
.badge { font-size: 12.5px; font-weight: 700; color: var(--muted); }
.decision { font-size: 29px; line-height: 1.1; font-weight: 800; letter-spacing: -.03em; color: var(--c); }
.reason { margin: 0 0 12px; max-width: 60ch; font-size: 15px; }
.chips { display: flex; flex-wrap: wrap; gap: 8px; margin-bottom: 14px; }
.chip { background: var(--surface); border: 1px solid var(--line); border-radius: 999px; padding: 4px 11px; font-size: 12.5px; font-weight: 600; color: var(--muted); }
.chip b { color: var(--text); font-variant-numeric: tabular-nums; }
.sheet .primary { height: 46px; }
@media (max-height: 640px) { header p { display: none; } .seg button { min-height: 34px; padding: 6px 4px; } input[type=number] { height: 38px; } .primary { height: 46px; } }
@media (prefers-reduced-motion: reduce) { * { transition: none !important; } }
</style>
</head>
<body>
<svg width="0" height="0" style="position:absolute" aria-hidden="true">
<defs>
<symbol id="i-up" viewBox="0 0 24 24"><polyline points="22 7 13.5 15.5 8.5 10.5 2 17"/><polyline points="16 7 22 7 22 13"/></symbol>
<symbol id="i-down" viewBox="0 0 24 24"><polyline points="22 17 13.5 8.5 8.5 13.5 2 7"/><polyline points="16 17 22 17 22 11"/></symbol>
<symbol id="i-range" viewBox="0 0 24 24"><path d="M8 3 4 7l4 4M4 7h16M16 21l4-4-4-4M20 17H4"/></symbol>
<symbol id="i-candle" viewBox="0 0 24 24"><path d="M9 2v4M9 18v4M15 5v3M15 16v4"/><rect x="7" y="6" width="4" height="12" rx="1"/><rect x="13" y="8" width="4" height="8" rx="1"/></symbol>
<symbol id="i-high" viewBox="0 0 24 24"><path d="M5 3h14M12 21V8M6 14l6-6 6 6"/></symbol>
<symbol id="i-low" viewBox="0 0 24 24"><path d="M5 21h14M12 3v13M6 10l6 6 6-6"/></symbol>
<symbol id="i-target" viewBox="0 0 24 24"><circle cx="12" cy="12" r="9"/><circle cx="12" cy="12" r="3"/></symbol>
<symbol id="i-wall" viewBox="0 0 24 24"><path d="M3 5h18v14H3zM3 12h18M9 5v7M15 12v7"/></symbol>
<symbol id="i-bars" viewBox="0 0 24 24"><path d="M3 20h18M6 20v-6M12 20V8M18 20v-9"/></symbol>
<symbol id="i-clock" viewBox="0 0 24 24"><circle cx="12" cy="12" r="9"/><path d="M12 7v5l3 2"/></symbol>
<symbol id="i-play" viewBox="0 0 24 24"><path d="M6 4l14 8-14 8z"/></symbol>
<symbol id="i-shield" viewBox="0 0 24 24"><path d="M12 3l8 3v6c0 5-3.5 8-8 9-4.5-1-8-4-8-9V6z"/></symbol>
<symbol id="i-cal" viewBox="0 0 24 24"><rect x="3" y="5" width="18" height="16" rx="2"/><path d="M3 10h18M8 3v4M16 3v4"/></symbol>
<symbol id="i-check" viewBox="0 0 24 24"><circle cx="12" cy="12" r="9"/><path d="M8 12l3 3 5-6"/></symbol>
<symbol id="i-ban" viewBox="0 0 24 24"><circle cx="12" cy="12" r="9"/><path d="M5.6 5.6l12.8 12.8"/></symbol>
<symbol id="i-reset" viewBox="0 0 24 24"><path d="M3 12a9 9 0 1 0 3-6.7L3 8M3 3v5h5"/></symbol>
<symbol id="i-arrow" viewBox="0 0 24 24"><path d="M5 12h14M13 6l6 6-6 6"/></symbol>
<symbol id="i-alert" viewBox="0 0 24 24"><circle cx="12" cy="12" r="9"/><path d="M12 8v4M12 16h.01"/></symbol>
</defs>
</svg>

<div class="app">
  <header>
    <div class="logo"><svg class="ic"><use href="#i-up"/></svg></div>
    <div class="t"><h1>Trading Decision Assistant</h1><p>Enter the levels and get a rule-based call.</p></div>
    <button class="ghost" type="button" id="reset"><svg class="ic"><use href="#i-reset"/></svg>Reset</button>
  </header>

  <main class="panel">
    <div class="row2">
      <div>
        <p class="sec"><svg class="ic"><use href="#i-cal"/></svg>Yesterday’s trend</p>
        <div class="seg c3" id="trendSeg">
          <button type="button" class="t-buy" data-v="Bullish" aria-pressed="true"><svg class="ic"><use href="#i-up"/></svg>Bullish</button>
          <button type="button" class="t-no" data-v="Bearish" aria-pressed="false"><svg class="ic"><use href="#i-down"/></svg>Bearish</button>
          <button type="button" class="t-wait" data-v="Range bound" aria-pressed="false"><svg class="ic"><use href="#i-range"/></svg>Range</button>
        </div>
      </div>
      <div>
        <p class="sec"><svg class="ic"><use href="#i-candle"/></svg>First candle today</p>
        <div class="seg c2" id="candleSeg">
          <button type="button" class="t-buy" data-v="Green" aria-pressed="true"><svg class="ic"><use href="#i-candle"/></svg>Green</button>
          <button type="button" class="t-no" data-v="Red" aria-pressed="false"><svg class="ic"><use href="#i-candle"/></svg>Red</button>
        </div>
      </div>
    </div>

    <div>
      <p class="sec"><svg class="ic"><use href="#i-cal"/></svg>Yesterday</p>
      <div class="grid3">
        <div class="field"><label for="high"><svg class="ic"><use href="#i-high"/></svg>High</label><input id="high" type="number" inputmode="decimal" placeholder="0"></div>
        <div class="field"><label for="low"><svg class="ic"><use href="#i-low"/></svg>Low</label><input id="low" type="number" inputmode="decimal" placeholder="0"></div>
        <div class="field"><label for="close"><svg class="ic"><use href="#i-target"/></svg>Close</label><input id="close" type="number" inputmode="decimal" placeholder="0"></div>
      </div>
    </div>

    <div>
      <p class="sec"><svg class="ic"><use href="#i-bars"/></svg>Levels</p>
      <div class="grid3">
        <div class="field"><label for="resistance"><svg class="ic"><use href="#i-wall"/></svg>Resistance</label><input id="resistance" type="number" inputmode="decimal" placeholder="Optional"></div>
        <div class="field"><label for="support"><svg class="ic"><use href="#i-bars"/></svg>Support</label><input id="support" type="number" inputmode="decimal" placeholder="Optional"></div>
        <div class="field"><label for="prevClose"><svg class="ic"><use href="#i-clock"/></svg>Prev close</label><input id="prevClose" type="number" inputmode="decimal" placeholder="Optional"></div>
      </div>
    </div>

    <div>
      <p class="sec"><svg class="ic"><use href="#i-play"/></svg>Today</p>
      <div class="grid3">
        <div class="field"><label for="open"><svg class="ic"><use href="#i-play"/></svg>Open</label><input id="open" type="number" inputmode="decimal" placeholder="0"></div>
        <div class="field"><label for="candleClose"><svg class="ic"><use href="#i-candle"/></svg>Candle close</label><input id="candleClose" type="number" inputmode="decimal" placeholder="0"></div>
        <div class="field off" id="rejectField"><label for="rejectClose" title="Used for Scenario 7: Bearish trend with a red candle"><svg class="ic"><use href="#i-shield"/></svg>Reject close</label><input id="rejectClose" type="number" inputmode="decimal" placeholder="Bearish + red" disabled></div>
      </div>
    </div>

    <p class="error" id="error" role="alert"><svg class="ic"><use href="#i-alert"/></svg><span id="errText"></span></p>
    <button class="primary" type="button" id="check">Check decision<svg class="ic"><use href="#i-arrow"/></svg></button>
  </main>
</div>

<div class="scrim" id="scrim"></div>
<section class="sheet" id="sheet" role="dialog" aria-live="polite" aria-label="Decision">
  <div class="head">
    <div class="big"><svg class="ic"><use id="bigIcon" href="#i-check"/></svg></div>
    <div><div class="badge" id="scenario"></div><div class="decision" id="decision"></div></div>
  </div>
  <p class="reason" id="reason"></p>
  <div class="chips" id="chips"></div>
  <button class="primary" type="button" id="done">Done</button>
</section>

<script>
var state = { trend: "Bullish", candle: "Green" };
function $(id) { return document.getElementById(id); }
function val(id) { return Number($(id).value); }

function bindSeg(segId, key) {
  var btns = $(segId).querySelectorAll("button");
  btns.forEach(function (b) {
    b.addEventListener("click", function () {
      state[key] = b.dataset.v;
      btns.forEach(function (x) { x.setAttribute("aria-pressed", x === b ? "true" : "false"); });
      syncReject();
    });
  });
}
function syncReject() {
  var on = state.trend === "Bearish" && state.candle === "Red";
  $("rejectField").classList.toggle("off", !on);
  $("rejectClose").disabled = !on;
}
bindSeg("trendSeg", "trend");
bindSeg("candleSeg", "candle");

var required = ["high", "low", "close", "open", "candleClose"];

function checkDecision() {
  var trend = state.trend, candle = state.candle;
  var err = $("error");
  var missing = required.filter(function (id) { return $(id).value.trim() === ""; });
  required.forEach(function (id) { $(id).classList.toggle("invalid", missing.indexOf(id) > -1); });
  if (missing.length) {
    $("errText").textContent = "Fill in the highlighted fields to get a decision.";
    err.classList.add("show");
    $(missing[0]).focus();
    return;
  }
  err.classList.remove("show");

  var high = val("high"), low = val("low"), close = val("close"), open = val("open");
  var candleClose = val("candleClose"), rejectClose = val("rejectClose");
  var noRes = $("resistance").value.trim() === "", noSup = $("support").value.trim() === "";
  var resistance = noRes ? NaN : val("resistance");
  var support = noSup ? NaN : val("support");

  var decision = "NO TRADE";
  var scenario = "No rule matched";
  var reason = "Your inputs do not match a defined scenario.";

  var resistanceGap = resistance - candleClose;
  var supportGap = candleClose - support;
  var rejectionGap = resistance - rejectClose;

  if (trend === "Bullish" && open < close && candle === "Green" && candleClose > high) {
    decision = "BUY"; scenario = "Scenario 11";
    reason = "Bullish trend, opening below yesterday’s close, and a green first candle closing above yesterday’s high.";
  }
  else if (trend === "Bullish" && open < close && candle === "Green") {
    decision = "BUY"; scenario = "Scenario 1";
    reason = "Bullish trend, opening below yesterday’s close and green first candle.";
  }
  else if (trend === "Bullish" && open > close && candle === "Red") {
    decision = "WAIT"; scenario = "Scenario 2";
    reason = "Wait for green candle crossing VWAP, then BUY.";
  }
  else if (trend === "Bearish" && open > high && resistanceGap > 60 && candle === "Green") {
    decision = "BUY"; scenario = "Scenario 3";
    reason = "Bearish gap-up with resistance gap greater than 60.";
  }
  else if (trend === "Bearish" && open > high && resistanceGap > 60 && candle === "Red") {
    decision = "WAIT"; scenario = "Scenario 4";
    reason = "Wait for green candle crossing VWAP, then BUY.";
  }
  else if (trend === "Range bound" && open > high && resistanceGap > 60 && candle === "Green") {
    decision = "BUY"; scenario = "Scenario 5";
    reason = "Range-bound trend with large resistance gap and green candle.";
  }
  else if (trend === "Range bound" && close === 1855 && open === 1858 && candleClose === 1865 && candle === "Green") {
    decision = "BUY SMALL / NO TRADE"; scenario = "Scenario 6";
    reason = "Small upside opportunity. Take fewer points or skip.";
  }
  else if (trend === "Bearish" && candle === "Red" && supportGap >= 0 && supportGap < 60 && rejectionGap > 60 && rejectClose > 0) {
    decision = "WAIT"; scenario = "Scenario 7";
    reason = "Wait for support rejection and green candle crossing VWAP.";
  }
  else if (trend === "Range bound" && close === 1855 && open === 1846 && candleClose === 1860 && candle === "Green") {
    decision = "BUY SMALL / NO TRADE"; scenario = "Scenario 8";
    reason = "Small upside opportunity. Take fewer points or skip.";
  }
  else if (trend === "Range bound" && open === 1865 && candleClose === 1858 && candle === "Red") {
    decision = "WAIT"; scenario = "Scenario 9";
    reason = "Wait for green candle crossing VWAP. Buy for fewer points or skip.";
  }
  else if (trend === "Bearish" && candle === "Green" && supportGap >= 0 && supportGap < 60) {
    decision = "WAIT"; scenario = "Scenario 10";
    reason = "Wait for support rejection and green candle crossing VWAP before BUY.";
  }
  else if (noRes || noSup) {
    reason = "No rule matched. Some rules need resistance and support, so add them and check again.";
  }

  var cls = decision.indexOf("BUY") > -1 ? "buy" : (decision === "WAIT" ? "wait" : "no");
  $("sheet").className = "sheet show " + cls;
  $("bigIcon").setAttribute("href", cls === "buy" ? "#i-check" : (cls === "wait" ? "#i-clock" : "#i-ban"));
  $("scrim").classList.add("show");
  $("decision").textContent = decision;
  $("scenario").textContent = scenario;
  $("reason").textContent = reason;
  $("chips").innerHTML =
    '<span class="chip">Resistance gap <b>' + fmt(resistanceGap) + '</b></span>' +
    '<span class="chip">Support gap <b>' + fmt(supportGap) + '</b></span>' +
    '<span class="chip">' + trend + ' · ' + candle + ' candle</span>';
  $("done").focus();
}
function fmt(n) { return isNaN(n) ? "—" : Math.round(n * 100) / 100; }
function closeSheet() { $("sheet").classList.remove("show"); $("scrim").classList.remove("show"); }

$("check").addEventListener("click", checkDecision);
$("done").addEventListener("click", closeSheet);
$("scrim").addEventListener("click", closeSheet);
document.addEventListener("keydown", function (e) {
  if (e.key === "Escape") closeSheet();
  else if (e.key === "Enter" && e.target.tagName === "INPUT") checkDecision();
});
$("reset").addEventListener("click", function () {
  document.querySelectorAll("input").forEach(function (i) { i.value = ""; i.classList.remove("invalid"); });
  $("trendSeg").querySelector("button").click();
  $("candleSeg").querySelector("button").click();
  closeSheet();
  $("error").classList.remove("show");
});
</script>
</body>
</html>
