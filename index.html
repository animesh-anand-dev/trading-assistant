<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Trading Decision Assistant</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;600;700;800&display=swap">
<style>
:root {
  --bg: #eef2f7; --surface: #ffffff; --surface-2: #f3f6fa; --line: #dbe3ee;
  --text: #0f1b2d; --muted: #5b6b82; --accent: #0b6bcb; --accent-ink: #ffffff;
  --buy: #0f8a4f; --buy-bg: #e3f6ec; --wait: #a86a00; --wait-bg: #fff2d6;
  --no: #c23b3b; --no-bg: #fde8e8; --focus: rgba(11,107,203,.28);
  --shadow: 0 1px 2px rgba(15,27,45,.06), 0 12px 32px rgba(15,27,45,.08);
  box-sizing: border-box;
  padding-top: env(safe-area-inset-top, 0px);
  padding-bottom: env(safe-area-inset-bottom, 0px);
  color-scheme: light;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #0b1220; --surface: #121c2f; --surface-2: #19263c; --line: #25344d;
    --text: #e8eefb; --muted: #94a3bd; --accent: #4aa3ff; --accent-ink: #06182e;
    --buy: #4ade80; --buy-bg: #10281d; --wait: #fbbf24; --wait-bg: #2b2310;
    --no: #f87171; --no-bg: #2d1717; --focus: rgba(74,163,255,.35);
    --shadow: 0 1px 2px rgba(0,0,0,.4), 0 16px 40px rgba(0,0,0,.35);
    color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #0b1220; --surface: #121c2f; --surface-2: #19263c; --line: #25344d;
  --text: #e8eefb; --muted: #94a3bd; --accent: #4aa3ff; --accent-ink: #06182e;
  --buy: #4ade80; --buy-bg: #10281d; --wait: #fbbf24; --wait-bg: #2b2310;
  --no: #f87171; --no-bg: #2d1717; --focus: rgba(74,163,255,.35);
  --shadow: 0 1px 2px rgba(0,0,0,.4), 0 16px 40px rgba(0,0,0,.35);
  color-scheme: dark;
}
html { scroll-padding-top: env(safe-area-inset-top, 0px); height: 100%; }
* { box-sizing: border-box; }
body {
  margin: 0; height: 100%; overflow: hidden; background: var(--bg); color: var(--text);
  font-family: "Manrope", system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
  font-size: 14px; line-height: 1.4; -webkit-font-smoothing: antialiased;
}
.app {
  height: 100%; max-width: 560px; margin: 0 auto; padding: 12px 14px;
  display: flex; flex-direction: column; gap: clamp(8px, 1.6vh, 14px);
}
header { display: flex; align-items: center; justify-content: space-between; gap: 10px; }
header h1 { font-size: 19px; line-height: 1.2; margin: 0; font-weight: 800; letter-spacing: -.02em; }
header p { margin: 0; color: var(--muted); font-size: 12.5px; }
.ghost {
  border: 1px solid var(--line); background: var(--surface); color: var(--muted);
  border-radius: 10px; padding: 7px 12px; font: inherit; font-size: 13px; font-weight: 600; cursor: pointer;
}
.ghost:hover { color: var(--text); }
.panel {
  flex: 1; min-height: 0; display: flex; flex-direction: column; justify-content: space-between; gap: 8px;
  background: var(--surface); border: 1px solid var(--line); border-radius: 18px; padding: 12px; box-shadow: var(--shadow);
}
.sec { font-size: 12px; font-weight: 700; color: var(--muted); margin: 0 0 5px 2px; }
.row2 { display: grid; grid-template-columns: 1fr; gap: 8px; }
.seg { display: grid; gap: 3px; padding: 3px; background: var(--surface-2); border: 1px solid var(--line); border-radius: 12px; }
.seg.c3 { grid-template-columns: repeat(3, 1fr); }
.seg.c2 { grid-template-columns: repeat(2, 1fr); }
.seg button {
  border: 0; background: transparent; color: var(--muted); font: inherit; font-size: 13.5px; font-weight: 700;
  padding: 8px 4px; border-radius: 9px; cursor: pointer; min-height: 38px;
  display: flex; align-items: center; justify-content: center; gap: 7px;
  transition: background .15s, color .15s, box-shadow .15s;
}
.seg button[aria-pressed="true"] { background: var(--surface); color: var(--text); box-shadow: 0 1px 3px rgba(15,27,45,.2); }
.dot { width: 9px; height: 9px; border-radius: 50%; background: var(--muted); }
.dot.g { background: var(--buy); } .dot.r { background: var(--no); }
.grid3 { display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; }
.field { display: flex; flex-direction: column; gap: 4px; min-width: 0; }
.field label { font-size: 12px; font-weight: 600; color: var(--muted); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.field.off { opacity: .45; }
input[type=number] {
  width: 100%; height: 42px; padding: 0 10px; border-radius: 11px;
  border: 1px solid var(--line); background: var(--surface-2); color: var(--text);
  font: inherit; font-size: 16px; font-variant-numeric: tabular-nums; outline: none;
  transition: border-color .15s, box-shadow .15s;
}
input[type=number]::placeholder { color: var(--muted); opacity: .55; }
input[type=number]:focus { border-color: var(--accent); box-shadow: 0 0 0 3px var(--focus); background: var(--surface); }
input[type=number]:disabled { cursor: not-allowed; }
input.invalid { border-color: var(--no); box-shadow: 0 0 0 3px var(--no-bg); }
button:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
.error { display: none; margin: 0; padding: 8px 12px; border-radius: 10px; background: var(--no-bg); color: var(--no); font-size: 13px; font-weight: 600; }
.error.show { display: block; }
.primary {
  width: 100%; height: 50px; flex: none; border: 0; border-radius: 14px; background: var(--accent); color: var(--accent-ink);
  font: inherit; font-size: 16px; font-weight: 800; cursor: pointer;
  transition: transform .1s, filter .15s;
}
.primary:hover { filter: brightness(1.06); }
.primary:active { transform: scale(.985); }
.scrim { position: fixed; inset: 0; background: rgba(5,10,20,.5); display: none; z-index: 5; }
.scrim.show { display: block; }
.sheet {
  position: fixed; left: 0; right: 0; bottom: 0; z-index: 6; margin: 0 auto; max-width: 560px;
  padding: 20px 18px calc(18px + env(safe-area-inset-bottom, 0px));
  border-radius: 22px 22px 0 0; border: 1px solid var(--line); border-bottom: 0;
  background: var(--surface); box-shadow: 0 -12px 40px rgba(0,0,0,.25);
  transform: translateY(105%); transition: transform .25s ease-out; visibility: hidden;
}
.sheet.show { transform: none; visibility: visible; }
.sheet.buy { background: var(--buy-bg); border-color: var(--buy); }
.sheet.wait { background: var(--wait-bg); border-color: var(--wait); }
.sheet.no { background: var(--no-bg); border-color: var(--no); }
.badge { font-size: 12.5px; font-weight: 700; color: var(--muted); }
.decision { font-size: 32px; line-height: 1.1; font-weight: 800; letter-spacing: -.03em; margin: 4px 0 8px; }
.sheet.buy .decision { color: var(--buy); } .sheet.wait .decision { color: var(--wait); } .sheet.no .decision { color: var(--no); }
.reason { margin: 0 0 12px; max-width: 60ch; font-size: 15px; }
.chips { display: flex; flex-wrap: wrap; gap: 8px; margin-bottom: 14px; }
.chip { background: var(--surface); border: 1px solid var(--line); border-radius: 999px; padding: 4px 11px; font-size: 12.5px; font-weight: 600; color: var(--muted); }
.chip b { color: var(--text); font-variant-numeric: tabular-nums; }
.sheet .primary { height: 46px; }
@media (max-height: 640px) { header p { display: none; } .seg button { min-height: 34px; padding: 6px 4px; } input[type=number] { height: 38px; } .primary { height: 46px; } }
@media (prefers-reduced-motion: reduce) { * { transition: none !important; } }
</style>
</head>
<body>
<div class="app">
  <header>
    <div>
      <h1>Trading Decision Assistant</h1>
      <p>Enter the levels and get a rule-based call.</p>
    </div>
    <button class="ghost" type="button" id="reset">Reset</button>
  </header>

  <main class="panel">
    <div class="row2">
      <div>
        <p class="sec">Yesterday’s trend</p>
        <div class="seg c3" id="trendSeg">
          <button type="button" data-v="Bullish" aria-pressed="true">Bullish</button>
          <button type="button" data-v="Bearish" aria-pressed="false">Bearish</button>
          <button type="button" data-v="Range bound" aria-pressed="false">Range bound</button>
        </div>
      </div>
      <div>
        <p class="sec">First candle today</p>
        <div class="seg c2" id="candleSeg">
          <button type="button" data-v="Green" aria-pressed="true"><span class="dot g"></span>Green</button>
          <button type="button" data-v="Red" aria-pressed="false"><span class="dot r"></span>Red</button>
        </div>
      </div>
    </div>

    <div>
      <p class="sec">Yesterday</p>
      <div class="grid3">
        <div class="field"><label for="high">High</label><input id="high" type="number" inputmode="decimal" placeholder="0"></div>
        <div class="field"><label for="low">Low</label><input id="low" type="number" inputmode="decimal" placeholder="0"></div>
        <div class="field"><label for="close">Close</label><input id="close" type="number" inputmode="decimal" placeholder="0"></div>
      </div>
    </div>

    <div>
      <p class="sec">Levels</p>
      <div class="grid3">
        <div class="field"><label for="resistance">Resistance</label><input id="resistance" type="number" inputmode="decimal" placeholder="0"></div>
        <div class="field"><label for="support">Support</label><input id="support" type="number" inputmode="decimal" placeholder="0"></div>
        <div class="field"><label for="prevClose">Prev close (opt.)</label><input id="prevClose" type="number" inputmode="decimal" placeholder="Optional"></div>
      </div>
    </div>

    <div>
      <p class="sec">Today</p>
      <div class="grid3">
        <div class="field"><label for="open">Open</label><input id="open" type="number" inputmode="decimal" placeholder="0"></div>
        <div class="field"><label for="candleClose">Candle close</label><input id="candleClose" type="number" inputmode="decimal" placeholder="0"></div>
        <div class="field off" id="rejectField"><label for="rejectClose" title="Used for Scenario 7: Bearish trend with a red candle">Reject close</label><input id="rejectClose" type="number" inputmode="decimal" placeholder="Bearish + red" disabled></div>
      </div>
    </div>

    <p class="error" id="error" role="alert"></p>
    <button class="primary" type="button" id="check">Check decision</button>
  </main>
</div>

<div class="scrim" id="scrim"></div>
<section class="sheet" id="sheet" role="dialog" aria-live="polite" aria-label="Decision">
  <div class="badge" id="scenario"></div>
  <div class="decision" id="decision"></div>
  <p class="reason" id="reason"></p>
  <div class="chips" id="chips"></div>
  <button class="primary" type="button" id="done">Done</button>
</section>

<script>
var state = { trend: "Bullish", candle: "Green" };
function $(id) { return document.getElementById(id); }
function val(id) { return Number($(id).value); }

function bindSeg(segId, key) {
  var btns = $(segId).querySelectorAll("button");
  btns.forEach(function (b) {
    b.addEventListener("click", function () {
      state[key] = b.dataset.v;
      btns.forEach(function (x) { x.setAttribute("aria-pressed", x === b ? "true" : "false"); });
      syncReject();
    });
  });
}
function syncReject() {
  var on = state.trend === "Bearish" && state.candle === "Red";
  $("rejectField").classList.toggle("off", !on);
  $("rejectClose").disabled = !on;
}
bindSeg("trendSeg", "trend");
bindSeg("candleSeg", "candle");

var required = ["high", "low", "close", "open", "resistance", "support", "candleClose"];

function checkDecision() {
  var trend = state.trend, candle = state.candle;
  var err = $("error");
  var missing = required.filter(function (id) { return $(id).value.trim() === ""; });
  required.forEach(function (id) { $(id).classList.toggle("invalid", missing.indexOf(id) > -1); });
  if (missing.length) {
    err.textContent = "Fill in the highlighted fields to get a decision.";
    err.classList.add("show");
    $(missing[0]).focus();
    return;
  }
  err.classList.remove("show");

  var high = val("high"), low = val("low"), close = val("close"), open = val("open");
  var resistance = val("resistance"), support = val("support");
  var candleClose = val("candleClose"), rejectClose = val("rejectClose");

  var decision = "NO TRADE";
  var scenario = "No rule matched";
  var reason = "Your inputs do not match a defined scenario.";

  var resistanceGap = resistance - candleClose;
  var supportGap = candleClose - support;
  var rejectionGap = resistance - rejectClose;

  if (trend === "Bullish" && open < close && candle === "Green") {
    decision = "BUY"; scenario = "Scenario 1";
    reason = "Bullish trend, opening below yesterday’s close and green first candle.";
  }
  else if (trend === "Bullish" && open > close && candle === "Red") {
    decision = "WAIT"; scenario = "Scenario 2";
    reason = "Wait for green candle crossing VWAP, then BUY.";
  }
  else if (trend === "Bearish" && open > high && resistanceGap > 60 && candle === "Green") {
    decision = "BUY"; scenario = "Scenario 3";
    reason = "Bearish gap-up with resistance gap greater than 60.";
  }
  else if (trend === "Bearish" && open > high && resistanceGap > 60 && candle === "Red") {
    decision = "WAIT"; scenario = "Scenario 4";
    reason = "Wait for green candle crossing VWAP, then BUY.";
  }
  else if (trend === "Range bound" && open > high && resistanceGap > 60 && candle === "Green") {
    decision = "BUY"; scenario = "Scenario 5";
    reason = "Range-bound trend with large resistance gap and green candle.";
  }
  else if (trend === "Range bound" && close === 1855 && open === 1858 && candleClose === 1865 && candle === "Green") {
    decision = "BUY SMALL / NO TRADE"; scenario = "Scenario 6";
    reason = "Small upside opportunity. Take fewer points or skip.";
  }
  else if (trend === "Bearish" && candle === "Red" && supportGap >= 0 && supportGap < 60 && rejectionGap > 60 && rejectClose > 0) {
    decision = "WAIT"; scenario = "Scenario 7";
    reason = "Wait for support rejection and green candle crossing VWAP.";
  }
  else if (trend === "Range bound" && close === 1855 && open === 1846 && candleClose === 1860 && candle === "Green") {
    decision = "BUY SMALL / NO TRADE"; scenario = "Scenario 8";
    reason = "Small upside opportunity. Take fewer points or skip.";
  }
  else if (trend === "Range bound" && open === 1865 && candleClose === 1858 && candle === "Red") {
    decision = "WAIT"; scenario = "Scenario 9";
    reason = "Wait for green candle crossing VWAP. Buy for fewer points or skip.";
  }
  else if (trend === "Bearish" && candle === "Green" && supportGap >= 0 && supportGap < 60) {
    decision = "WAIT"; scenario = "Scenario 10";
    reason = "Wait for support rejection and green candle crossing VWAP before BUY.";
  }

  var cls = decision.indexOf("BUY") > -1 ? "buy" : (decision === "WAIT" ? "wait" : "no");
  $("sheet").className = "sheet show " + cls;
  $("scrim").classList.add("show");
  $("decision").textContent = decision;
  $("scenario").textContent = scenario;
  $("reason").textContent = reason;
  $("chips").innerHTML =
    '<span class="chip">Resistance gap <b>' + round(resistanceGap) + '</b></span>' +
    '<span class="chip">Support gap <b>' + round(supportGap) + '</b></span>' +
    '<span class="chip">' + trend + ' · ' + candle + ' candle</span>';
  $("done").focus();
}
function round(n) { return Math.round(n * 100) / 100; }
function closeSheet() { $("sheet").classList.remove("show"); $("scrim").classList.remove("show"); }

$("check").addEventListener("click", checkDecision);
$("done").addEventListener("click", closeSheet);
$("scrim").addEventListener("click", closeSheet);
document.addEventListener("keydown", function (e) {
  if (e.key === "Escape") closeSheet();
  else if (e.key === "Enter" && e.target.tagName === "INPUT") checkDecision();
});
$("reset").addEventListener("click", function () {
  document.querySelectorAll("input").forEach(function (i) { i.value = ""; i.classList.remove("invalid"); });
  $("trendSeg").querySelector("button").click();
  $("candleSeg").querySelector("button").click();
  closeSheet();
  $("error").classList.remove("show");
});
</script>
</body>
</html>
